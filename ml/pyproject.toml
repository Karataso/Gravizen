[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalis-ml"
version = "0.1.0"
description = "Motor de evaluacion de Vitalis (reglas, Isolation Forest y proyeccion)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[tool.setuptools]
packages = ["ml"]
package-dir = { ml = "." }
